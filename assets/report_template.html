<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   Palette e token. Per adattare il report ai colori di un cliente cambia solo
   --accent e --accent-ink qui sotto, oppure passa meta.accent dentro data.json.
   I colori delle serie (--s1..--s5) sono stati verificati per leggibilita' e
   per distinguibilita' in caso di daltonismo, in chiaro e in scuro: se li
   sostituisci, rivalidali invece di fidarti dell'occhio.
   --------------------------------------------------------------------------- */
:root{
  --font: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --bg:#ffffff; --surface:#f4f5f6; --surface-2:#ffffff;
  --ink:#191919; --muted:#595959; --faint:#8a8a8a; --border:#e2e4e7;
  --accent:#e52217; --accent-ink:#ffffff;
  --s1:#5781ff; --s2:#e52217; --s3:#118541; --s4:#551fc4; --s5:#db5e29;
  --pos:#118541; --mix:#db5e29; --neu:#9a9a9a; --neg:#e52217; --unk:#c6c9cc;
  --seq:#5781ff;
  --good:#118541; --warning:#db5e29; --critical:#e52217;
  --radius:10px; --maxw:1100px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191919; --surface:#212121; --surface-2:#1e1e1e;
    --ink:#f4f5f6; --muted:#b4b4b4; --faint:#8f8f8f; --border:#333333;
    --s4:#7b4dd8; --neu:#8a8a8a; --unk:#5a5a5a;
  }
}
:root[data-theme="dark"]{
  --bg:#191919; --surface:#212121; --surface-2:#1e1e1e;
  --ink:#f4f5f6; --muted:#b4b4b4; --faint:#8f8f8f; --border:#333333;
  --s4:#7b4dd8; --neu:#8a8a8a; --unk:#5a5a5a;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:76px}
body{
  margin:0; background:var(--bg); color:var(--muted);
  font-family:var(--font); font-size:15px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 16px}

/* Tipografia */
h1,h2,h3,h4{color:var(--ink); font-family:var(--font); margin:0}
h1{font-size:30px; font-weight:600; line-height:1.2; letter-spacing:-.01em}
h2{font-size:24px; font-weight:500; text-transform:uppercase; letter-spacing:.02em; line-height:1.25}
h3{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink)}
h4{font-size:15px; font-weight:600}
p{margin:0 0 12px}
a{color:var(--accent); text-underline-offset:2px}
strong{font-weight:600; color:inherit}
ul{margin:0 0 12px; padding-left:20px; list-style:disc}
li{margin:4px 0}
.lead{font-size:17px; line-height:1.55; color:var(--ink)}
.small{font-size:13px}
.faint{color:var(--faint)}

/* Header */
header.top{background:var(--surface); border-bottom:1px solid var(--border); padding:30px 0}
.brandline{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:14px}
.eyebrow{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--accent)}
/* Logo di chi firma il report. Due file, uno per fondo chiaro e uno per fondo
   scuro, alternati dal tema. Se non caricano si nascondono da soli e resta il
   nome dell'autore fra i dati in testata: il report non deve mai mostrare
   l'icona di un'immagine rotta. */
.logo{height:26px; width:auto; display:block; flex:none}
.logo.dk{display:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .logo.lt{display:none}
  :root:not([data-theme="light"]) .logo.dk{display:block}
}
:root[data-theme="dark"] .logo.lt{display:none}
:root[data-theme="dark"] .logo.dk{display:block}
:root[data-theme="light"] .logo.lt{display:block}
:root[data-theme="light"] .logo.dk{display:none}

/* Canali */
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px}
.tabs button{
  font:inherit; font-size:13px; font-weight:500; cursor:pointer;
  padding:7px 14px; border-radius:999px; white-space:nowrap;
  background:var(--surface); border:1px solid var(--border); color:var(--muted);
}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.tabs button .n{font-variant-numeric:tabular-nums; opacity:.7; margin-left:6px}
.pane{display:none}
.pane.on{display:block}
.paneName{display:none}
.mixbar{height:10px; border-radius:5px; background:var(--surface); overflow:hidden; display:flex; margin:4px 0 0}
.mixbar i{height:100%; display:block}
.mixbar i+i{margin-left:2px}
.metarow{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
.chip{
  font-size:12px; padding:4px 10px; border-radius:999px;
  background:var(--surface-2); border:1px solid var(--border); color:var(--muted); white-space:nowrap;
}

/* Nav */
nav.toc{
  position:sticky; top:0; z-index:20; background:var(--bg);
  border-bottom:1px solid var(--border); padding:10px 0;
}
nav.toc .wrap{display:flex; gap:6px; overflow-x:auto; align-items:center; scrollbar-width:thin}
nav.toc a{
  font-size:12.5px; font-weight:500; color:var(--muted); text-decoration:none;
  padding:6px 11px; border-radius:999px; white-space:nowrap; border:1px solid transparent;
}
nav.toc a:hover{background:var(--surface); color:var(--ink)}
nav.toc a.on{background:var(--accent); color:var(--accent-ink)}
.themeBtn{
  margin-left:auto; flex:none; background:transparent; border:1px solid var(--border);
  color:var(--muted); border-radius:999px; padding:5px 11px; font:inherit; font-size:12px; cursor:pointer;
}

/* Sezioni */
section{padding:40px 0 8px; border-bottom:1px solid var(--border)}
section:last-of-type{border-bottom:none}
.shead{margin-bottom:18px}
.shead p{margin:6px 0 0; max-width:70ch}

/* Card e griglie */
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:var(--radius); padding:18px;
}
.card.flat{background:transparent}

/* KPI */
.kpi .label{font-size:12px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; color:var(--muted)}
.kpi .value{font-size:34px; font-weight:600; color:var(--ink); line-height:1.1; margin:6px 0 2px; font-variant-numeric:tabular-nums}
.kpi .note{font-size:12.5px; color:var(--faint)}
.kpi.good .value{color:var(--good)} .kpi.warning .value{color:var(--warning)} .kpi.critical .value{color:var(--critical)}

/* Grafici */
.chartbox{margin-top:6px}
.chartwrap{position:relative; height:300px}
.chartwrap.tall{height:380px}
.legend{display:flex; flex-wrap:wrap; gap:14px; margin:12px 0 0}
.legend span{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted)}
.legend i{width:11px; height:11px; border-radius:3px; display:inline-block; flex:none}
details.data{margin-top:12px}
details.data>summary{
  cursor:pointer; font-size:12px; font-weight:600; text-transform:uppercase;
  letter-spacing:.05em; color:var(--faint); list-style:none; padding:4px 0;
}
details.data>summary::-webkit-details-marker{display:none}
details.data>summary::before{content:"+ "; font-weight:700}
details.data[open]>summary::before{content:"- "}

/* Tabelle */
table{width:100%; border-collapse:collapse; font-size:13.5px}
th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top}
th{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); font-weight:700; white-space:nowrap}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto}

/* Badge */
.badge{
  display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase;
  letter-spacing:.04em; padding:2px 8px; border-radius:999px; white-space:nowrap;
  border:1px solid var(--border); color:var(--muted);
}
.badge.ok{color:var(--good); border-color:color-mix(in srgb, var(--good) 40%, transparent)}
.badge.warn{color:var(--warning); border-color:color-mix(in srgb, var(--warning) 40%, transparent)}
.badge.bad{color:var(--critical); border-color:color-mix(in srgb, var(--critical) 40%, transparent)}

/* Citazioni */
.quote{border-left:3px solid var(--border); padding:2px 0 2px 14px; margin:10px 0}
.quote.pos{border-color:var(--pos)} .quote.neg{border-color:var(--neg)}
.quote.mix{border-color:var(--mix)} .quote.neu{border-color:var(--neu)}
.quote p{margin:0 0 4px; color:var(--ink); font-size:14.5px}
.quote .src{font-size:12px; color:var(--faint)}

/* Temi */
.theme{padding:16px 0; border-bottom:1px solid var(--border)}
.theme:last-child{border-bottom:none}
.theme .head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.theme .vol{font-size:13px; color:var(--faint); font-variant-numeric:tabular-nums}
.bar{height:8px; border-radius:4px; background:var(--surface); overflow:hidden; display:flex; margin:10px 0 8px}
.bar i{height:100%; display:block}
.bar i+i{margin-left:2px}

/* Nota interpretativa */
.interp{
  border-left:3px solid var(--accent); background:var(--surface);
  padding:12px 16px; border-radius:0 var(--radius) var(--radius) 0; margin:16px 0;
}
.interp h3{margin-bottom:6px; color:var(--accent)}
.interp p:last-child{margin-bottom:0}

footer{padding:30px 0 44px; color:var(--faint); font-size:12.5px}
.note{font-size:12.5px; color:var(--faint); margin-top:10px}

@media print{
  nav.toc,.themeBtn,.tabs{display:none}
  .pane{display:block; break-inside:avoid; padding-top:8px}
  .paneName{display:block; font-size:16px; margin:18px 0 10px; text-transform:uppercase; letter-spacing:.04em}
  .logo.dk{display:none}
  .logo.lt{display:block}
  body{font-size:11pt}
  section{break-inside:avoid; border-bottom:1px solid #ddd}
  .card{break-inside:avoid}
  details.data{display:none}
}
@media (max-width:640px){
  h1{font-size:24px} h2{font-size:20px}
  .kpi .value{font-size:27px}
  .chartwrap{height:260px}
}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brandline">
    <span class="eyebrow">Brand Reputation Audit</span>
    <span id="h-logo"></span>
  </div>
  <h1 id="h-title">&nbsp;</h1>
  <p class="lead" id="h-headline" style="margin-top:10px; max-width:72ch"></p>
  <div class="metarow" id="h-meta"></div>
</div></header>

<nav class="toc"><div class="wrap" id="toc"></div></nav>

<main class="wrap" id="main"></main>

<footer class="wrap">
  <p id="f-note"></p>
  <p class="faint">Report generato con la skill <strong>brand-reputation-audit</strong>. I dati grezzi di ogni fonte
  sono nella cartella <code>raw/</code> accanto a questo file, la metodologia completa in <code>METODOLOGIA.md</code>.</p>
</footer>

<script id="audit-data" type="application/json">__AUDIT_DATA__</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
(function(){
"use strict";

var D = {};
try { D = JSON.parse(document.getElementById('audit-data').textContent) || {}; }
catch(e){ document.getElementById('main').innerHTML = '<section><h2>Dati non leggibili</h2><p>Il blocco dati di questo report non è un JSON valido.</p></section>'; return; }

var meta = D.meta || {};
var css  = getComputedStyle(document.documentElement);
function tok(n){ return (css.getPropertyValue(n)||'').trim(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function num(n){ return (n==null||isNaN(n)) ? '' : Number(n).toLocaleString('it-IT'); }
function pct(x,d){ return (x==null||isNaN(x)) ? '' : (Number(x)*100).toFixed(d==null?0:d).replace('.',',')+'%'; }
function has(a){ return Array.isArray(a) ? a.length>0 : (a && Object.keys(a).length>0); }

if (meta.accent){
  document.documentElement.style.setProperty('--accent', meta.accent);
}

/* Logo di chi firma il report. I due file si sostituiscono con meta.logo e
   meta.logo_dark; meta.logo = false toglie il logo del tutto. */
var LOGO_DEFAULT      = 'https://mocainteractive.com/assets/svg/logo.svg';
var LOGO_DARK_DEFAULT = 'https://mocainteractive.com/assets/svg/logo-light.svg';
(function(){
  if (meta.logo === false || meta.logo === null) return;
  var lt = meta.logo || LOGO_DEFAULT;
  var dk = meta.logo_dark || (meta.logo ? meta.logo : LOGO_DARK_DEFAULT);
  var alt = meta.author ? meta.author : 'Logo';
  var box = document.getElementById('h-logo');
  box.innerHTML = '<img class="logo lt" src="'+esc(lt)+'" alt="'+esc(alt)+'">'
                + '<img class="logo dk" src="'+esc(dk)+'" alt="'+esc(alt)+'">';
  [].forEach.call(box.querySelectorAll('img'), function(img){
    img.addEventListener('error', function(){ box.style.display = 'none'; });
  });
})();

/* ---------- Palette delle serie: ordine fisso, mai ciclato ---------- */
var SERIES_TOKENS = ['--s1','--s2','--s3','--s4','--s5'];
function series(){ return SERIES_TOKENS.map(tok); }
/* Nelle legende in HTML passiamo la variabile CSS e non il valore risolto,
   cosi' i quadratini seguono il cambio di tema senza ridisegnare la pagina. */
function cssv(n){ return 'var('+n+')'; }
var SENT = [
  {k:'positive',    l:'Positivo',       v:'--pos'},
  {k:'mixed',       l:'Misto',          v:'--mix'},
  {k:'neutral',     l:'Neutro',         v:'--neu'},
  {k:'negative',    l:'Negativo',       v:'--neg'},
  {k:'unclassified',l:'Non classificato',v:'--unk'}
];

/* ---------- Header ---------- */
document.getElementById('h-title').textContent = (meta.brand||'Brand') + (meta.market? ' · '+meta.market : '');
document.title = 'Brand Reputation Audit ' + (meta.brand||'');
if (D.summary && D.summary.headline) document.getElementById('h-headline').textContent = D.summary.headline;

var chips = [];
if (meta.collected_at) chips.push('Raccolta dati: '+meta.collected_at);
if (meta.period && (meta.period.from||meta.period.to)) chips.push('Periodo: '+(meta.period.from||'?')+' – '+(meta.period.to||'?'));
if (meta.depth) chips.push('Profondità: '+meta.depth);
if (meta.domain) chips.push(meta.domain);
if (has(meta.competitors)) chips.push('Confronto: '+meta.competitors.join(', '));
if (meta.author) chips.push('A cura di '+meta.author);
document.getElementById('h-meta').innerHTML = chips.map(function(c){ return '<span class="chip">'+esc(c)+'</span>'; }).join('');
document.getElementById('f-note').textContent =
  'Le risposte degli LLM e le SERP cambiano nel tempo. Le rilevazioni di questo report si riferiscono al '
  + (meta.collected_at||'giorno della raccolta') + ' e vanno considerate datate.';

/* ---------- Helper di rendering ---------- */
var sections = [];
function S(id,title,sub,html){
  if (!html) return;
  sections.push({id:id,title:title});
  var el = document.createElement('section');
  el.id = id;
  el.innerHTML = '<div class="shead"><h2>'+esc(title)+'</h2>'+(sub?'<p>'+esc(sub)+'</p>':'')+'</div>'+html;
  document.getElementById('main').appendChild(el);
}
function table(cols, rows){
  if (!rows.length) return '';
  var h = cols.map(function(c){ return '<th'+(c.num?' class="num"':'')+'>'+esc(c.t)+'</th>'; }).join('');
  var b = rows.map(function(r){
    return '<tr>'+cols.map(function(c,i){
      return '<td'+(c.num?' class="num"':'')+'>'+(r[i]==null?'':r[i])+'</td>';
    }).join('')+'</tr>';
  }).join('');
  return '<div class="scroll"><table><thead><tr>'+h+'</tr></thead><tbody>'+b+'</tbody></table></div>';
}
function dataTable(cols, rows){
  if (!rows.length) return '';
  return '<details class="data"><summary>Vedi i dati del grafico</summary>'+table(cols,rows)+'</details>';
}
function legend(items){
  return '<div class="legend">'+items.map(function(it){
    return '<span><i style="background:'+it.c+'"></i>'+esc(it.l)+'</span>';
  }).join('')+'</div>';
}
function canvas(id, tall){ return '<div class="chartwrap'+(tall?' tall':'')+'"><canvas id="'+id+'"></canvas></div>'; }

var charts = [];
function draw(id, cfg){
  if (typeof Chart === 'undefined') return;
  var el = document.getElementById(id); if (!el) return;
  var grid = tok('--border'), ink = tok('--muted'), surf = tok('--surface-2');
  /* La legenda la disegniamo noi in HTML, cosi' resta leggibile anche in stampa e
     quando Chart.js non si carica. Il merge su plugins deve essere per chiave,
     altrimenti un grafico che passa solo tooltip si riporta in casa la legenda
     predefinita di Chart.js e ne mostra due. */
  var base = {
    legend:{display:false},
    tooltip:{
      backgroundColor:tok('--ink'), titleColor:tok('--bg'), bodyColor:tok('--bg'),
      padding:10, cornerRadius:6, displayColors:true, boxPadding:4,
      titleFont:{family:tok('--font'),size:12,weight:'600'},
      bodyFont:{family:tok('--font'),size:12}
    }
  };
  var given = (cfg.options && cfg.options.plugins) || {};
  cfg.options = Object.assign({
    responsive:true, maintainAspectRatio:false,
    interaction:{mode:'index', intersect:false}
  }, cfg.options||{});
  cfg.options.plugins = {
    legend: Object.assign({}, base.legend, given.legend||{}),
    tooltip: Object.assign({}, base.tooltip, given.tooltip||{})
  };
  cfg.options.scales = cfg.options.scales || {};
  Object.keys(cfg.options.scales).forEach(function(k){
    var s = cfg.options.scales[k];
    s.grid = Object.assign({color:grid, drawTicks:false, drawBorder:false}, s.grid||{});
    s.border = {display:false};
    s.ticks = Object.assign({color:ink, font:{family:tok('--font'),size:11.5}, padding:6}, s.ticks||{});
  });
  (cfg.data.datasets||[]).forEach(function(d){
    if (cfg.type==='bar'){
      d.borderRadius = d.borderRadius==null ? 4 : d.borderRadius;
      d.borderSkipped = false;
      if (d.borderWidth==null){ d.borderWidth = 2; d.borderColor = surf; }
    }
    if (cfg.type==='line'){
      d.borderWidth = 2; d.tension = .25; d.pointRadius = 3; d.pointHoverRadius = 6;
      d.pointBorderColor = surf; d.pointBorderWidth = 2;
    }
  });
  try { charts.push(new Chart(el.getContext('2d'), cfg)); } catch(e){}
}

/* ===================== 1. In sintesi ===================== */
(function(){
  var s = D.summary; if (!s) return;
  var h = '';
  if (has(s.kpis)){
    h += '<div class="grid g4">'+s.kpis.map(function(k){
      return '<div class="card kpi '+esc(k.tone||'neutral')+'">'
        + '<div class="label">'+esc(k.label||'')+'</div>'
        + '<div class="value">'+esc(k.value==null?'':k.value)+'</div>'
        + (k.note?'<div class="note">'+esc(k.note)+'</div>':'')+'</div>';
    }).join('')+'</div>';
  }
  if (has(s.bullets)){
    h += '<div class="card flat" style="padding-left:0"><h3 style="margin:22px 0 10px">Cosa emerge</h3><ul>'
      + s.bullets.map(function(b){ return '<li>'+esc(b)+'</li>'; }).join('')+'</ul></div>';
  }
  if (has(meta.questions)){
    h += '<div class="interp"><h3>Le domande di questo audit</h3><ul style="margin-bottom:0">'
      + meta.questions.map(function(q){ return '<li>'+esc(q)+'</li>'; }).join('')+'</ul></div>';
  }
  S('sintesi','In sintesi', null, h);
})();

/* ===================== 2. Fonti e sentiment ===================== */
(function(){
  var h = '';

  if (has(D.sources)){
    var rows = D.sources.map(function(s){
      var cls = s.status==='ok'?'ok':(s.status==='partial'?'warn':(s.status==='failed'?'bad':''));
      var lab = {ok:'Completa',partial:'Parziale',failed:'Fallita',skipped:'Esclusa'}[s.status]||s.status||'';
      return [esc(s.name||s.id||''), num(s.items), esc(s.period||''),
              '<span class="badge '+cls+'">'+esc(lab)+'</span>', esc(s.note||'')];
    });
    h += table([{t:'Fonte'},{t:'Contenuti',num:true},{t:'Periodo'},{t:'Stato'},{t:'Nota'}], rows);
  }

  if (has(D.sentiment_by_source)){
    h += '<h3 style="margin:28px 0 4px">Sentiment per fonte</h3>'
      + '<p class="small" style="max-width:70ch">Conteggi di contenuti raccolti, non di clienti. Chi scrive una recensione o apre '
      + 'un thread è autoselezionato e più polarizzato della media, quindi le proporzioni vanno lette per fonte e non sommate.</p>'
      + canvas('cSent');
    h += legend(SENT.map(function(s){ return {l:s.l, c:cssv(s.v)}; }));
    var cols = [{t:'Fonte'}].concat(SENT.map(function(s){ return {t:s.l, num:true}; })).concat([{t:'Totale',num:true}]);
    h += dataTable(cols, D.sentiment_by_source.map(function(r){
      var tot = SENT.reduce(function(a,s){ return a + (r[s.k]||0); },0);
      return [esc(r.source)].concat(SENT.map(function(s){ return num(r[s.k]||0); })).concat([num(tot)]);
    }));
  }

  if (D.volume_over_time && has(D.volume_over_time.points)){
    h += '<h3 style="margin:30px 0 8px">Volume nel tempo</h3>' + canvas('cVol');
    var srcs = {};
    D.volume_over_time.points.forEach(function(p){ Object.keys(p.by_source||{}).forEach(function(k){ srcs[k]=1; }); });
    var keys = Object.keys(srcs).slice(0,5);
    h += legend(keys.map(function(k,i){ return {l:k, c:cssv(SERIES_TOKENS[i])}; }));
    h += dataTable([{t:'Periodo'}].concat(keys.map(function(k){ return {t:k,num:true}; })),
      D.volume_over_time.points.map(function(p){
        return [esc(p.date)].concat(keys.map(function(k){ return num((p.by_source||{})[k]||0); }));
      }));
  }

  S('fonti','Fonti e sentiment','Cosa è stato raccolto, da dove, e come si distribuisce il giudizio su ciascuna piattaforma.', h);
})();

/* ===================== 2bis. Cronistoria =====================
   Il pezzo che trasforma una fotografia in un racconto: come sono cambiati
   sentiment, temi e visibilita' negli LLM lungo la finestra analizzata. */
(function(){
  var T = D.timeline; if (!T) return;
  var h = '';
  var sparse = (T.sentiment||[]).filter(function(p){ return p.sparse; }).length;

  if (T.narrative){
    h += '<div class="interp"><h3>Come è cambiata la conversazione</h3><p>'+esc(T.narrative)+'</p></div>';
  }

  if (has(T.sentiment)){
    h += '<h3 style="margin:26px 0 4px">Composizione del giudizio, periodo per periodo</h3>'
      + '<p class="small" style="max-width:72ch">Quote calcolate su ciascun periodo, non sul totale: '
      + 'serve a separare un aumento di negatività da un semplice aumento di volume. Il totale dei '
      + 'contenuti di ogni periodo è nella tabella qui sotto.</p>'
      + canvas('cTimeSent')
      + legend(SENT.map(function(s){ return {l:s.l, c:cssv(s.v)}; }));
    if (sparse){
      h += '<p class="note">'+sparse+' periodi contengono meno di trenta contenuti e sono marcati come '
        + 'poco popolati nella tabella: su quelle basi le percentuali non reggono e vanno lette come conteggi.</p>';
    }
    h += dataTable(
      [{t:'Periodo'},{t:'Contenuti',num:true}].concat(SENT.map(function(s){ return {t:s.l,num:true}; })).concat([{t:'Nota'}]),
      T.sentiment.map(function(p){
        var tot = p.total || SENT.reduce(function(a,s){ return a+(p[s.k]||0); },0);
        return [esc(p.date), num(tot)]
          .concat(SENT.map(function(s){ return num(p[s.k]||0); }))
          .concat([p.sparse ? '<span class="badge warn">poco popolato</span>' : '']);
      }));
  }

  if (has(T.themes)){
    h += '<h3 style="margin:30px 0 4px">Peso dei temi nel tempo</h3>'
      + '<p class="small" style="max-width:72ch">Quota di ciascun tema sul totale del periodo. È qui che si '
      + 'vede un tema che nasce, uno che cresce e uno che sparisce, che è di solito l\'informazione più '
      + 'utile dell\'intera cronistoria.</p>'
      + canvas('cTimeThemes')
      + legend(T.themes.slice(0,5).map(function(t,i){ return {l:t.name, c:cssv(SERIES_TOKENS[i])}; }));
    var dates = {};
    T.themes.forEach(function(t){ (t.points||[]).forEach(function(p){ dates[p.date]=1; }); });
    var dk = Object.keys(dates).sort();
    h += dataTable([{t:'Periodo'}].concat(T.themes.slice(0,5).map(function(t){ return {t:t.name,num:true}; })),
      dk.map(function(d){
        return [esc(d)].concat(T.themes.slice(0,5).map(function(t){
          var pt = (t.points||[]).filter(function(x){ return x.date===d; })[0];
          return pt ? (pt.share!=null ? pct(pt.share,1) : num(pt.volume)) : '';
        }));
      }));
  }

  if (T.llm_visibility && has(T.llm_visibility.points)){
    var V = T.llm_visibility;
    h += '<h3 style="margin:30px 0 4px">Visibilità negli LLM nel tempo</h3>'
      + '<p class="small" style="max-width:72ch">'+esc(V.note || 'Serie storica delle menzioni, misurata su un archivio di risposte generative.')
      + ' Misura una cosa diversa dai prompt eseguiti per questo audit e non va sommata a quelli.</p>'
      + canvas('cLlmVis');
    var ents = {};
    V.points.forEach(function(p){ Object.keys(p.by_entity||{}).forEach(function(k){ ents[k]=1; }); });
    var ek = Object.keys(ents).slice(0,5);
    h += legend(ek.map(function(k,i){ return {l:k, c:cssv(SERIES_TOKENS[i])}; }));
    h += dataTable([{t:'Periodo'}].concat(ek.map(function(k){ return {t:k,num:true}; })),
      V.points.map(function(p){
        return [esc(p.date)].concat(ek.map(function(k){ return num((p.by_entity||{})[k]||0); }));
      }));
  }

  if (has(T.milestones)){
    var kb = {picco:'warn', svolta:'bad', evento:'', artefatto:'warn'};
    h += '<h3 style="margin:30px 0 8px">Cosa è successo, e quando</h3>'
      + table([{t:'Periodo'},{t:'Tipo'},{t:'Cosa'},{t:'Spiegazione'}],
        T.milestones.map(function(m){
          return [esc(m.date), '<span class="badge '+(kb[m.kind]||'')+'">'+esc(m.kind||'')+'</span>',
                  esc(m.label||''), esc(m.explanation||'')];
        }));
    h += '<p class="note">Un picco è un evento isolato, una svolta è una pendenza che si mantiene su più '
      + 'periodi: il primo si spiega, la seconda si affronta. Gli artefatti sono variazioni dovute alla '
      + 'raccolta e non alla realtà, segnalate per non essere lette come tendenze.</p>';
  }

  S('cronistoria','Cronistoria','Come sono cambiati volume, giudizio e temi lungo il periodo analizzato. Le quote di ogni periodo sono calcolate sul periodo stesso.', h);
})();

/* ===================== 3. Temi ===================== */
(function(){
  if (!has(D.themes)) return;
  var h = canvas('cThemes', true);
  h += dataTable([{t:'Tema'},{t:'Contenuti',num:true},{t:'Quota',num:true},{t:'Negativi',num:true}],
    D.themes.map(function(t){
      var s = t.sentiment||{};
      return [esc(t.name), num(t.volume), pct(t.share,1), num(s.negative||0)];
    }));

  h += '<div style="margin-top:26px">' + D.themes.map(function(t){
    var s = t.sentiment||{}, tot = SENT.reduce(function(a,x){ return a+(s[x.k]||0); },0) || 1;
    var bar = SENT.map(function(x){
      var v = s[x.k]||0; if (!v) return '';
      return '<i style="width:'+(v/tot*100)+'%; background:'+cssv(x.v)+'"></i>';
    }).join('');
    var by = t.by_source ? Object.keys(t.by_source).map(function(k){
      return '<span class="chip">'+esc(k)+' '+num(t.by_source[k])+'</span>'; }).join('') : '';
    var q = has(t.quotes) ? t.quotes.slice(0,3).map(function(c){
      var m = {positive:'pos',negative:'neg',mixed:'mix',neutral:'neu'}[c.sentiment]||'neu';
      return '<div class="quote '+m+'"><p>“'+esc(c.text)+'”</p>'
        + '<div class="src">'+esc(c.source||'')+(c.date?' · '+esc(c.date):'')+'</div></div>';
    }).join('') : '';
    return '<div class="theme">'
      + '<div class="head"><h3>'+esc(t.name)+'</h3>'
      + '<span class="vol">'+num(t.volume)+' contenuti'+(t.share!=null?' · '+pct(t.share,1)+' del totale':'')+'</span></div>'
      + (t.definition?'<p class="small" style="margin:6px 0 0">'+esc(t.definition)+'</p>':'')
      + '<div class="bar">'+bar+'</div>'
      + (by?'<div class="metarow" style="margin-top:2px">'+by+'</div>':'')
      + q + '</div>';
  }).join('') + '</div>';

  S('temi','Temi ricorrenti','I temi emergono dal materiale raccolto, non da una lista predefinita. Le citazioni sono testuali.', h);
})();

/* ===================== 3ter. Canale per canale =====================
   Non chiede dati nuovi: incrocia sentiment_by_source, sources e i temi con la
   loro ripartizione per fonte. Cosi' non puo' disallinearsi dal resto del
   report, e chi compila data.json non deve scrivere due volte le stesse cose. */
(function(){
  if (!has(D.sentiment_by_source)) return;

  var extra = {};
  (D.channels || []).forEach(function(c){ extra[c.name || c.id] = c; });
  var meta_by_name = {};
  (D.sources || []).forEach(function(s){ meta_by_name[s.name || s.id] = s; });

  var chans = D.sentiment_by_source.map(function(r){
    var tot = SENT.reduce(function(a,s){ return a + (r[s.k]||0); }, 0);
    var themes = (D.themes || []).map(function(t){
      var v = (t.by_source || {})[r.source] || 0;
      return v ? { name:t.name, volume:v, share:v/tot } : null;
    }).filter(Boolean).sort(function(a,b){ return b.volume - a.volume; });
    var quotes = [];
    (D.themes || []).forEach(function(t){
      (t.quotes || []).forEach(function(q){
        if (q.source === r.source) quotes.push({ q:q, theme:t.name });
      });
    });
    return { name:r.source, row:r, total:tot, themes:themes, quotes:quotes,
             src:meta_by_name[r.source] || {}, extra:extra[r.source] || {} };
  }).sort(function(a,b){ return b.total - a.total; });

  if (!chans.length) return;
  var grand = chans.reduce(function(a,c){ return a + c.total; }, 0) || 1;

  /* La tabella che risponde alla domanda vera: lo stesso brand ha problemi
     diversi a seconda di dove lo si ascolta. */
  var h = '<p class="small" style="max-width:72ch">Ogni piattaforma ha un pubblico e norme sue, quindi i '
    + 'numeri si leggono per canale e non si sommano. La riga che conta è il tema dominante: quando cambia '
    + 'da un canale all\'altro, il brand ha problemi diversi a seconda di dove lo si ascolta.</p>'
    + table([{t:'Canale'},{t:'Contenuti',num:true},{t:'Quota',num:true},{t:'Negativi',num:true},{t:'Tema dominante'}],
        chans.map(function(c){
          var neg = c.total ? (c.row.negative||0)/c.total : 0;
          var top = c.themes[0];
          return [esc(c.name), num(c.total), pct(c.total/grand,0), pct(neg,0),
                  top ? esc(top.name)+' <span class="faint">'+pct(top.share,0)+'</span>' : ''];
        }));

  h += '<div class="tabs" id="chTabs">' + chans.map(function(c,i){
    return '<button type="button" data-i="'+i+'"'+(i===0?' class="on"':'')+'>'
      + esc(c.name)+'<span class="n">'+num(c.total)+'</span></button>';
  }).join('') + '</div>';

  h += chans.map(function(c,i){
    var neg = c.total ? (c.row.negative||0)/c.total : 0;
    var pos = c.total ? (c.row.positive||0)/c.total : 0;
    var bar = SENT.map(function(s){
      var v = c.row[s.k]||0; if (!v) return '';
      return '<i style="width:'+(v/(c.total||1)*100)+'%; background:'+cssv(s.v)+'"></i>';
    }).join('');

    var head = '<div class="grid g4" style="margin-bottom:18px">'
      + '<div class="card kpi"><div class="label">Contenuti</div><div class="value">'+num(c.total)+'</div>'
      +   '<div class="note">'+pct(c.total/grand,0)+' del totale raccolto</div></div>'
      + '<div class="card kpi '+(neg>=.4?'critical':(neg>=.25?'warning':''))+'"><div class="label">Negativi</div>'
      +   '<div class="value">'+pct(neg,0)+'</div><div class="note">'+num(c.row.negative||0)+' contenuti</div></div>'
      + '<div class="card kpi"><div class="label">Positivi</div><div class="value">'+pct(pos,0)+'</div>'
      +   '<div class="note">'+num(c.row.positive||0)+' contenuti</div></div>'
      + '<div class="card"><div class="label" style="font-size:12px; text-transform:uppercase; letter-spacing:.05em; font-weight:600">Composizione</div>'
      +   '<div class="mixbar" style="margin-top:12px">'+bar+'</div>'
      +   '<div class="note" style="margin-top:8px">'+esc(c.src.period || '')+'</div></div>'
      + '</div>';

    var note = c.extra.note || c.src.note;
    if (note) head += '<p class="small faint" style="margin:-6px 0 18px">'+esc(note)+'</p>';

    var themes = c.themes.length
      ? '<h3 style="margin:0 0 10px">Di cosa si parla su '+esc(c.name)+'</h3>'
        + table([{t:'Tema'},{t:'Contenuti',num:true},{t:'Quota del canale',num:true}],
            c.themes.slice(0,8).map(function(t){
              return [esc(t.name), num(t.volume), pct(t.share,0)];
            }))
      : '';

    var quotes = c.quotes.length
      ? '<h3 style="margin:26px 0 4px">Come lo dicono</h3>'
        + c.quotes.slice(0,4).map(function(x){
            var m = {positive:'pos',negative:'neg',mixed:'mix',neutral:'neu'}[x.q.sentiment]||'neu';
            return '<div class="quote '+m+'"><p>“'+esc(x.q.text)+'”</p>'
              + '<div class="src">'+esc(x.theme)+(x.q.date?' · '+esc(x.q.date):'')+'</div></div>';
          }).join('')
      : '<p class="note" style="margin-top:20px">Per questo canale non sono state estratte citazioni rappresentative.</p>';

    return '<div class="pane'+(i===0?' on':'')+'" data-i="'+i+'">'
      + '<h4 class="paneName">'+esc(c.name)+'</h4>' + head + themes + quotes + '</div>';
  }).join('');

  S('canali','Canale per canale','Gli stessi contenuti visti per piattaforma invece che per tema: volume, giudizio, di cosa si parla e come lo si dice.', h);
})();

/* ===================== 3bis. Dentro i video =====================
   I commenti dicono cosa pensa il pubblico, la trascrizione dice cosa gli e'
   stato detto. L'unita' e' l'occorrenza in cui il brand viene nominato. */
(function(){
  var V = D.video_mentions; if (!V || !has(V.items)) return;
  var RL = {soggetto:'Soggetto del video', confronto:'Termine di paragone', citazione:'Citazione di passaggio'};
  var SB = {positive:'ok', negative:'bad', mixed:'warn', neutral:''};
  var SL = {positive:'positivo', negative:'negativo', mixed:'misto', neutral:'neutro'};

  var h = '';
  var chips = [];
  if (V.videos_analysed) chips.push(V.videos_analysed+' video analizzati');
  if (V.occurrences)     chips.push(V.occurrences+' passaggi in cui il brand è nominato');
  if (chips.length) h += '<div class="metarow" style="margin-bottom:16px">'+chips.map(function(c){ return '<span class="chip">'+esc(c)+'</span>'; }).join('')+'</div>';
  if (V.note) h += '<p class="small" style="max-width:72ch">'+esc(V.note)+'</p>';

  h += V.items.map(function(it){
    var m = {positive:'pos',negative:'neg',mixed:'mix',neutral:'neu'}[it.sentiment]||'neu';
    var head = [];
    if (it.role)    head.push('<span class="badge '+(it.role==='soggetto'?'':'')+'">'+esc(RL[it.role]||it.role)+'</span>');
    if (it.sentiment) head.push('<span class="badge '+(SB[it.sentiment]||'')+'">'+esc(SL[it.sentiment]||it.sentiment)+'</span>');
    if (it.theme)   head.push('<span class="chip">'+esc(it.theme)+'</span>');
    if (it.views!=null) head.push('<span class="chip">'+num(it.views)+' visualizzazioni</span>');
    var title = it.url ? '<a href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(it.video_title||it.url)+'</a>'
                       : esc(it.video_title||'');
    return '<div class="theme">'
      + '<h4 style="margin-bottom:2px">'+title+'</h4>'
      + '<div class="src small faint" style="margin-bottom:8px">'+esc(it.channel||'')
      +   (it.published?' · '+esc(it.published):'')+(it.timestamp?' · minuto '+esc(it.timestamp):'')+'</div>'
      + (head.length?'<div class="metarow" style="margin:0 0 10px">'+head.join('')+'</div>':'')
      + '<div class="quote '+m+'"><p>“'+esc(it.quote||'')+'”</p></div>'
      + (it.divergence?'<p class="note"><strong>Nei commenti si legge altro.</strong> '+esc(it.divergence)+'</p>':'')
      + '</div>';
  }).join('');

  h += '<p class="note">I passaggi sono citati con il minutaggio per essere verificabili in pochi secondi. '
    + 'Dove la trascrizione è automatica può sbagliare i nomi propri, quindi ogni citazione usata come prova '
    + 'è stata ricontrollata sul video.</p>';

  S('video','Cosa si dice dentro i video','Estratti dalle trascrizioni di canali terzi, non del brand. Il giudizio di chi ha il microfono pesa più di molti commenti e finisce spesso fra le fonti che gli LLM leggono.', h);
})();

/* ===================== 4. Risposte degli LLM ===================== */
(function(){
  var L = D.llm; if (!L) return;
  var h = '';

  var info = [];
  if (has(L.models)) info.push('Modelli interrogati: '+L.models.join(', '));
  if (L.runs_per_prompt) info.push('Esecuzioni per prompt: '+L.runs_per_prompt);
  if (info.length) h += '<div class="metarow" style="margin-bottom:18px">'+info.map(function(i){ return '<span class="chip">'+esc(i)+'</span>'; }).join('')+'</div>';

  if (has(L.share_of_voice)){
    h += '<h3 style="margin:0 0 4px">Share of voice generativo</h3>'
      + '<p class="small" style="max-width:70ch">Quota di risposte in cui l\'entità viene nominata, sui prompt che <strong>non</strong> '
      + 'contengono il nome del brand. È la misura di quanto il brand esiste nella risposta quando nessuno lo evoca.</p>'
      + canvas('cSov');
    h += dataTable([{t:'Entità'},{t:'Menzioni',num:true},{t:'Esecuzioni',num:true},{t:'Quota',num:true},{t:'Posizione media',num:true}],
      L.share_of_voice.map(function(r){
        return [esc(r.entity)+(r.is_brand?' <span class="badge ok">brand</span>':''), num(r.mentions), num(r.runs),
                pct(r.share,0), r.avg_position!=null?String(r.avg_position).replace('.',','):''];
      }));
  }

  if (has(L.by_family)){
    h += '<h3 style="margin:30px 0 8px">Presenza del brand per tipo di domanda</h3>' + canvas('cFam');
    h += dataTable([{t:'Famiglia di prompt'},{t:'Presenza del brand',num:true},{t:'Esecuzioni',num:true}],
      L.by_family.map(function(r){ return [esc(r.family), pct(r.brand_share,0), num(r.runs)]; }));
  }

  if (has(L.facts)){
    var vb = {corretto:'ok', impreciso:'warn', errato:'bad', obsoleto:'warn'};
    h += '<h3 style="margin:30px 0 8px">Cosa i modelli sbagliano sul brand</h3>'
      + table([{t:'Affermazione del modello'},{t:'Verdetto'},{t:'Come stanno le cose'},{t:'Fonte probabile'}],
        L.facts.map(function(f){
          return [esc(f.claim), '<span class="badge '+(vb[f.verdict]||'')+'">'+esc(f.verdict||'')+'</span>',
                  esc(f.reality||''), esc(f.source_guess||'')];
        }));
    h += '<p class="note">Registra cosa afferma un modello in una data rilevazione, non accerta un fatto sul brand.</p>';
  }

  if (has(L.objections)){
    h += '<h3 style="margin:30px 0 8px">Obiezioni riportate dai modelli</h3>'
      + table([{t:'Obiezione'},{t:'Ricorrenze',num:true},{t:'Fonti citate'}],
        L.objections.map(function(o){
          return [esc(o.text), num(o.frequency), esc((o.cited_sources||[]).join(', '))];
        }));
  }

  S('llm','Come ne parlano gli LLM','Rilevazione puntuale e datata. Le risposte dei modelli non sono deterministiche: dove indicato, il dato è una frequenza su più esecuzioni.', h);
})();

    + 'posizioni delle query di brand. Le righe in cui il brand è assente sono la lista di lavoro per la digital PR, quelle in cui '

              {l:'Citazioni AI Overview', c:cssv('--s3')},
              {l:'Presenze in SERP', c:cssv('--s5')}])
    + table([{t:'Dominio'},{t:'Citazioni LLM',num:true},{t:'Citazioni AI Overview',num:true},{t:'Presenze in SERP',num:true},{t:'Totale',num:true},{t:'Il brand'},{t:'Nota'}],
      D.sources_map.map(function(r){

/* ===================== 10. Metodologia ===================== */
(function(){
  var m = D.methodology; if (!m) return;
  var h = '<div class="grid g2">';
  if (has(m.notes))  h += '<div class="card"><h3>Come sono stati raccolti</h3><ul>'+m.notes.map(function(n){ return '<li>'+esc(n)+'</li>'; }).join('')+'</ul></div>';
  if (has(m.limits)) h += '<div class="card"><h3>Limiti dichiarati</h3><ul>'+m.limits.map(function(n){ return '<li>'+esc(n)+'</li>'; }).join('')+'</ul></div>';
  h += '</div>';
  if (has(m.failed_sources)){
    h += '<h3 style="margin:26px 0 8px">Fonti non raccolte</h3>'
      + table([{t:'Fonte'},{t:'Motivo'}], m.failed_sources.map(function(f){ return [esc(f.source), esc(f.reason||'')]; }));
  }
  var foot = [];
  if (m.calls && m.calls.dataforseo!=null) foot.push('Chiamate DataForSEO: '+num(m.calls.dataforseo));
  if (m.calls && m.calls.apify_runs!=null) foot.push('Run Apify: '+num(m.calls.apify_runs));
  if (m.cost_estimate) foot.push('Costo stimato: '+m.cost_estimate);
  if (foot.length) h += '<div class="metarow" style="margin-top:20px">'+foot.map(function(f){ return '<span class="chip">'+esc(f)+'</span>'; }).join('')+'</div>';
  S('metodo','Metodologia e limiti', null, h);
})();

/* ===================== Tab dei canali ===================== */
(function(){
  var tabs = document.getElementById('chTabs'); if (!tabs) return;
  var sec = tabs.closest('section');
  tabs.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    var i = b.getAttribute('data-i');
    [].forEach.call(tabs.querySelectorAll('button'), function(x){ x.classList.toggle('on', x === b); });
    [].forEach.call(sec.querySelectorAll('.pane'), function(p){
      p.classList.toggle('on', p.getAttribute('data-i') === i);
    });
  });
  /* In stampa i pannelli nascosti sparirebbero: li apriamo tutti, con il nome
     del canale in testa, cosi' il PDF contiene tutti i canali e non solo il primo. */
  window.addEventListener('beforeprint', function(){
    [].forEach.call(sec.querySelectorAll('.pane'), function(p){ p.classList.add('on'); });
  });
})();

/* ===================== Navigazione ===================== */
(function(){
  var toc = document.getElementById('toc');
  toc.innerHTML = sections.map(function(s){ return '<a href="#'+s.id+'">'+esc(s.title)+'</a>'; }).join('')
    + '<button class="themeBtn" id="tbtn" type="button">Tema</button>';
  var btn = document.getElementById('tbtn');
  btn.addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var dark = cur ? cur==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
    charts.forEach(function(c){ try{ c.destroy(); }catch(e){} });
    charts = []; render();
  });
  var links = [].slice.call(toc.querySelectorAll('a'));
  if ('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(en){
      en.forEach(function(e){
        if (!e.isIntersecting) return;
        links.forEach(function(a){ a.classList.toggle('on', a.getAttribute('href')==='#'+e.target.id); });
      });
    }, {rootMargin:'-70px 0px -70% 0px'});
    sections.forEach(function(s){ var el=document.getElementById(s.id); if (el) io.observe(el); });
  }
})();

/* ===================== Grafici ===================== */
function render(){
  var pal = series();

  if (has(D.sentiment_by_source)){
    draw('cSent', {
      type:'bar',
      data:{
        labels: D.sentiment_by_source.map(function(r){ return r.source; }),
        datasets: SENT.map(function(s){
          return { label:s.l, data:D.sentiment_by_source.map(function(r){ return r[s.k]||0; }), backgroundColor:tok(s.v) };
        })
      },
      options:{ indexAxis:'y', scales:{ x:{stacked:true, beginAtZero:true}, y:{stacked:true, grid:{display:false}} } }
    });
  }

  if (D.volume_over_time && has(D.volume_over_time.points)){
    var srcs = {};
    D.volume_over_time.points.forEach(function(p){ Object.keys(p.by_source||{}).forEach(function(k){ srcs[k]=1; }); });
    var keys = Object.keys(srcs).slice(0,5);
    draw('cVol', {
      type:'line',
      data:{
        labels: D.volume_over_time.points.map(function(p){ return p.date; }),
        datasets: keys.map(function(k,i){
          return { label:k, data:D.volume_over_time.points.map(function(p){ return (p.by_source||{})[k]||0; }),
                   borderColor:pal[i], backgroundColor:pal[i] };
        })
      },
      options:{ scales:{ x:{grid:{display:false}}, y:{beginAtZero:true} } }
    });
  }

  /* Cronistoria, composizione del giudizio: barre impilate normalizzate al 100%.
     La quota di ogni periodo si legge sul periodo stesso, mentre il volume
     assoluto resta nel grafico dei volumi e nella tabella qui sotto. */
  if (D.timeline && has(D.timeline.sentiment)){
    var TS = D.timeline.sentiment;
    var totals = TS.map(function(p){
      return p.total || SENT.reduce(function(a,s){ return a+(p[s.k]||0); },0) || 1;
    });
    draw('cTimeSent', {
      type:'bar',
      data:{
        labels: TS.map(function(p){ return p.date + (p.sparse?' *':''); }),
        datasets: SENT.map(function(s){
          return { label:s.l, backgroundColor:tok(s.v),
            data: TS.map(function(p,i){ return Math.round((p[s.k]||0)/totals[i]*1000)/10; }) };
        })
      },
      options:{
        plugins:{ tooltip:{ callbacks:{
          label:function(c){ return c.dataset.label+': '+String(c.parsed.y).replace('.',',')+'%'; },
          footer:function(items){ return items.length ? 'Contenuti nel periodo: '+num(totals[items[0].dataIndex]) : ''; }
        } } },
        scales:{ x:{stacked:true, grid:{display:false}},
                 y:{stacked:true, beginAtZero:true, max:100, ticks:{callback:function(v){ return v+'%'; }}} }
      }
    });
  }

  if (D.timeline && has(D.timeline.themes)){
    var TT = D.timeline.themes.slice(0,5);
    var td = {};
    D.timeline.themes.forEach(function(t){ (t.points||[]).forEach(function(p){ td[p.date]=1; }); });
    var tdk = Object.keys(td).sort();
    draw('cTimeThemes', {
      type:'line',
      data:{
        labels: tdk,
        datasets: TT.map(function(t,i){
          return { label:t.name, borderColor:pal[i], backgroundColor:pal[i],
            data: tdk.map(function(d){
              var pt = (t.points||[]).filter(function(x){ return x.date===d; })[0];
              return pt ? (pt.share!=null ? Math.round(pt.share*1000)/10 : pt.volume) : null;
            }), spanGaps:true };
        })
      },
      options:{
        plugins:{ tooltip:{ callbacks:{
          label:function(c){ return c.dataset.label+': '+String(c.parsed.y).replace('.',',')+'%'; } } } },
        scales:{ x:{grid:{display:false}},
                 y:{beginAtZero:true, ticks:{callback:function(v){ return v+'%'; }}} }
      }
    });
  }

  if (D.timeline && D.timeline.llm_visibility && has(D.timeline.llm_visibility.points)){
    var VP = D.timeline.llm_visibility.points, ents = {};
    VP.forEach(function(p){ Object.keys(p.by_entity||{}).forEach(function(k){ ents[k]=1; }); });
    var ek = Object.keys(ents).slice(0,5);
    draw('cLlmVis', {
      type:'line',
      data:{
        labels: VP.map(function(p){ return p.date; }),
        datasets: ek.map(function(k,i){
          return { label:k, borderColor:pal[i], backgroundColor:pal[i],
                   data: VP.map(function(p){ return (p.by_entity||{})[k]; }), spanGaps:true };
        })
      },
      options:{ scales:{ x:{grid:{display:false}}, y:{beginAtZero:true} } }
    });
  }

  if (has(D.themes)){
    draw('cThemes', {
      type:'bar',
      data:{
        labels: D.themes.map(function(t){ return t.name; }),
        datasets: SENT.map(function(s){
          return { label:s.l, data:D.themes.map(function(t){ return (t.sentiment||{})[s.k]||0; }), backgroundColor:tok(s.v) };
        })
      },
      options:{ indexAxis:'y', scales:{ x:{stacked:true, beginAtZero:true}, y:{stacked:true, grid:{display:false}} } }
    });
  }

  if (D.llm && has(D.llm.share_of_voice)){
    var sov = D.llm.share_of_voice;
    draw('cSov', {
      type:'bar',
      data:{
        labels: sov.map(function(r){ return r.entity; }),
        datasets:[{ label:'Share of voice',
          data: sov.map(function(r){ return Math.round((r.share||0)*1000)/10; }),
          backgroundColor: sov.map(function(r){ return r.is_brand ? tok('--accent') : tok('--s1'); }) }]
      },
      options:{ indexAxis:'y',
        plugins:{ tooltip:{ callbacks:{ label:function(c){ return c.parsed.x.toString().replace('.',',')+'%'; } } } },
        scales:{ x:{beginAtZero:true, max:100, ticks:{callback:function(v){ return v+'%'; }}}, y:{grid:{display:false}} } }
    });
  }

  if (D.llm && has(D.llm.by_family)){
    draw('cFam', {
      type:'bar',
      data:{
        labels: D.llm.by_family.map(function(r){ return r.family; }),
        datasets:[{ label:'Presenza del brand',
          data: D.llm.by_family.map(function(r){ return Math.round((r.brand_share||0)*1000)/10; }),
          backgroundColor: tok('--accent') }]
      },
      options:{ indexAxis:'y',
        plugins:{ tooltip:{ callbacks:{ label:function(c){ return c.parsed.x.toString().replace('.',',')+'%'; } } } },
        scales:{ x:{beginAtZero:true, max:100, ticks:{callback:function(v){ return v+'%'; }}}, y:{grid:{display:false}} } }
    });
  }

  if (has(D.sources_map)){
    var top = D.sources_map.slice(0,12);
    draw('cSrc', {
      type:'bar',
      data:{
        labels: top.map(function(r){ return r.domain; }),
        datasets:[
          { label:'Citazioni LLM',          data:top.map(function(r){ return r.llm_citations||0; }), backgroundColor:tok('--s1') },
          { label:'Citazioni AI Overview',  data:top.map(function(r){ return r.aio_citations||0; }), backgroundColor:tok('--s3') },
          { label:'Presenze in SERP',       data:top.map(function(r){ return r.serp_positions||0; }), backgroundColor:tok('--s5') }
        ]
      },
      options:{ indexAxis:'y', scales:{ x:{stacked:true, beginAtZero:true}, y:{stacked:true, grid:{display:false}} } }
    });
  }
}

if (typeof Chart === 'undefined'){
  /* Senza connessione i grafici non si disegnano: apriamo le tabelle dei dati,
     cosi' il report resta leggibile e verificabile comunque. */
  [].forEach.call(document.querySelectorAll('details.data'), function(d){ d.open = true; });
  [].forEach.call(document.querySelectorAll('.chartwrap'), function(c){
    c.innerHTML = '<p class="small faint" style="padding:12px 0">Grafico non disponibile senza connessione. I dati sono nella tabella qui sotto.</p>';
    c.style.height = 'auto';
  });
} else {
  render();
}

})();
</script>
</body>
